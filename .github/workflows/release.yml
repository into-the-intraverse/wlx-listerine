name: Release

on:
  push:
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write  # required by softprops/action-gh-release to create/update the Release
    env:
      CONAN_VERSION: "2.27.0"

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          # workflow_dispatch from a tag and tag-push both expose the tag name
          # via GITHUB_REF_NAME. Strip optional leading "v".
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Detect MSVC version
        id: msvc
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationVersion
          "version=$vs" >> $env:GITHUB_OUTPUT

      # Conan package IDs depend on the MSVC version and the home layout on the
      # Conan version, so both are in the key. Only ~/.conan2/p is cached (the
      # package store is self-consistent); caching profiles/ would make the bare
      # `conan profile detect` below fail on every cache hit.
      - name: Restore Conan package cache
        id: conan-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ env.CONAN_VERSION }}-msvc${{ steps.msvc.outputs.version }}-${{ hashFiles('conanfile.txt', 'conan.lock') }}
          restore-keys: conan-${{ runner.os }}-${{ env.CONAN_VERSION }}-msvc${{ steps.msvc.outputs.version }}-

      - name: Install Conan
        run: |
          uv pip install --system conan==${{ env.CONAN_VERSION }}
          conan profile detect

      - name: Install C++ dependencies
        run: conan install . --output-folder=build --build=missing -s build_type=Release -s compiler.cppstd=20

      # Drop source/build/download folders from the store before saving - the
      # build only consumes the package binaries, and on restore-keys partial
      # hits the snapshot would otherwise grow monotonically across
      # conanfile changes.
      - name: Prune Conan store before save
        if: steps.conan-cache.outputs.cache-hit != 'true'
        run: conan cache clean "*"

      # Explicit save right after install: the monolithic cache action saves only
      # when the whole job succeeds, and the visual suite at the end is the flaky
      # part - a failing seed run would never populate the cache.
      - name: Save Conan package cache
        if: steps.conan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ env.CONAN_VERSION }}-msvc${{ steps.msvc.outputs.version }}-${{ hashFiles('conanfile.txt', 'conan.lock') }}

      - name: Configure CMake
        # Run under bash: PowerShell's expression parser mangles dotted args
        # like `-DWLX_VERSION=1.2.0` (it sees `1.2.0` as member-access on a decimal).
        shell: bash
        run: cmake --preset conan-default -DWLX_VERSION=${{ steps.version.outputs.version }}

      - name: Build
        run: cmake --build --preset conan-release

      - name: Run unit tests
        run: |
          ./build/Release/tests.exe
          ./build/Release/colorizer-tests.exe

      - name: Install Cascadia Code font
        shell: pwsh
        run: |
          $url = "https://github.com/microsoft/cascadia-code/releases/download/v2404.23/CascadiaCode-2404.23.zip"
          Invoke-WebRequest -Uri $url -OutFile cascadia.zip
          Expand-Archive cascadia.zip -DestinationPath cascadia
          $fontDir = "$env:LOCALAPPDATA\Microsoft\Windows\Fonts"
          New-Item -ItemType Directory -Path $fontDir -Force | Out-Null
          Get-ChildItem cascadia/ttf/static/*.ttf | ForEach-Object {
              $dest = Join-Path $fontDir $_.Name
              Copy-Item $_.FullName $dest -Force
              New-ItemProperty -Path "HKCU:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts" `
                  -Name $_.BaseName -Value $dest -PropertyType String -Force | Out-Null
          }

      - name: Run visual regression tests
        shell: bash
        run: ./scripts/visual-test.sh

      - name: Package plugin ZIPs
        shell: pwsh
        run: ./scripts/package.ps1 '${{ steps.version.outputs.version }}'

      - name: Upload plugin ZIPs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: wlx-listerine-${{ steps.version.outputs.version }}
          path: |
            wlx-listerine-md-${{ steps.version.outputs.version }}.zip
            wlx-listerine-colorizer-${{ steps.version.outputs.version }}.zip
          retention-days: 90

      - name: Attach plugin ZIPs to GitHub Release
        # Only when ref is a tag (push of a tag, or workflow_dispatch from a tag).
        # Auto-creates the Release if it does not exist and uploads the zips as assets.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            wlx-listerine-md-${{ steps.version.outputs.version }}.zip
            wlx-listerine-colorizer-${{ steps.version.outputs.version }}.zip

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: test_data/cases/*_diff.png
          retention-days: 14
