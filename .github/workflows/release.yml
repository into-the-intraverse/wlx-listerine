name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version (e.g. 1.1.0). Used as the WLX_VERSION source of truth."
        required: true
        type: string

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Rewrite SSH GitHub URLs to HTTPS
        shell: bash
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Conan
        run: |
          uv pip install --system conan
          conan profile detect

      - name: Install C++ dependencies
        run: conan install . --output-folder=build --build=missing -s build_type=Release -s compiler.cppstd=20

      - name: Configure CMake
        run: cmake --preset conan-default -DWLX_VERSION=${{ steps.version.outputs.version }}

      - name: Build
        run: cmake --build --preset conan-release

      - name: Run unit tests
        run: |
          ./build/Release/tests.exe
          ./build/Release/colorizer-tests.exe

      - name: Install Cascadia Code font
        shell: pwsh
        run: |
          $url = "https://github.com/microsoft/cascadia-code/releases/download/v2404.23/CascadiaCode-2404.23.zip"
          Invoke-WebRequest -Uri $url -OutFile cascadia.zip
          Expand-Archive cascadia.zip -DestinationPath cascadia
          $fontDir = "$env:LOCALAPPDATA\Microsoft\Windows\Fonts"
          New-Item -ItemType Directory -Path $fontDir -Force | Out-Null
          Get-ChildItem cascadia/ttf/static/*.ttf | ForEach-Object {
              $dest = Join-Path $fontDir $_.Name
              Copy-Item $_.FullName $dest -Force
              New-ItemProperty -Path "HKCU:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts" `
                  -Name $_.BaseName -Value $dest -PropertyType String -Force | Out-Null
          }

      - name: Run visual regression tests
        shell: bash
        run: ./scripts/visual-test.sh

      - name: Package plugin ZIPs
        shell: pwsh
        run: ./scripts/package.ps1 ${{ steps.version.outputs.version }}

      - name: Upload plugin ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: wlx-listerine-${{ steps.version.outputs.version }}
          path: |
            wlx-listerine-md-*.zip
            wlx-listerine-colorizer-*.zip
          retention-days: 90

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: test_data/cases/*_diff.png
          retention-days: 14
