name: Release

on:
  push:
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write  # required by softprops/action-gh-release to create/update the Release

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          # workflow_dispatch from a tag and tag-push both expose the tag name
          # via GITHUB_REF_NAME. Strip optional leading "v".
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Conan
        run: |
          uv pip install --system conan
          conan profile detect

      - name: Install C++ dependencies
        run: conan install . --output-folder=build --build=missing -s build_type=Release -s compiler.cppstd=20

      - name: Configure CMake
        # Run under bash: PowerShell's expression parser mangles dotted args
        # like `-DWLX_VERSION=1.2.0` (it sees `1.2.0` as member-access on a decimal).
        shell: bash
        run: cmake --preset conan-default -DWLX_VERSION=${{ steps.version.outputs.version }} -DWLX_REQUIRE_ALL_GRAMMARS=ON

      - name: Build
        run: cmake --build --preset conan-release

      - name: Run unit tests
        run: |
          ./build/Release/tests.exe
          ./build/Release/colorizer-tests.exe

      - name: Install Cascadia Code font
        shell: pwsh
        run: |
          $url = "https://github.com/microsoft/cascadia-code/releases/download/v2404.23/CascadiaCode-2404.23.zip"
          Invoke-WebRequest -Uri $url -OutFile cascadia.zip
          Expand-Archive cascadia.zip -DestinationPath cascadia
          $fontDir = "$env:LOCALAPPDATA\Microsoft\Windows\Fonts"
          New-Item -ItemType Directory -Path $fontDir -Force | Out-Null
          Get-ChildItem cascadia/ttf/static/*.ttf | ForEach-Object {
              $dest = Join-Path $fontDir $_.Name
              Copy-Item $_.FullName $dest -Force
              New-ItemProperty -Path "HKCU:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts" `
                  -Name $_.BaseName -Value $dest -PropertyType String -Force | Out-Null
          }

      - name: Run visual regression tests
        shell: bash
        run: ./scripts/visual-test.sh

      - name: Package plugin ZIPs
        shell: pwsh
        run: ./scripts/package.ps1 '${{ steps.version.outputs.version }}'

      - name: Upload plugin ZIPs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: wlx-listerine-${{ steps.version.outputs.version }}
          path: |
            wlx-listerine-md-${{ steps.version.outputs.version }}.zip
            wlx-listerine-colorizer-${{ steps.version.outputs.version }}.zip
          retention-days: 90

      - name: Attach plugin ZIPs to GitHub Release
        # Only when ref is a tag (push of a tag, or workflow_dispatch from a tag).
        # Auto-creates the Release if it does not exist and uploads the zips as assets.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            wlx-listerine-md-${{ steps.version.outputs.version }}.zip
            wlx-listerine-colorizer-${{ steps.version.outputs.version }}.zip

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: test_data/cases/*_diff.png
          retention-days: 14
