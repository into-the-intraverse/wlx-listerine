version = 1

[general]
extensions = ["c", "h", "cpp", "cc", "cxx", "hpp", "hxx", "py", "pyi", "js", "mjs", "cjs", "jsx", "ts", "tsx", "mts", "rs", "go", "java", "cs", "php", "lua", "sh", "bash", "zsh", "bashrc", "bash_profile", "bash_aliases", "bash_logout", "zshrc", "zshenv", "zprofile", "zlogin", "zlogout", "profile", "envrc", "ps1", "psm1", "psd1", "vim", "vimrc", "nvimrc", "json", "jsonc", "toml", "yaml", "yml", "html", "htm", "xml", "svg", "css", "md", "markdown", "vcxproj", "csproj", "fsproj", "vbproj", "proj", "props", "targets", "filters", "slnx", "xaml", "resx", "cmake", "sql", "dockerfile", "dockerignore", "gitconfig", "gitmodules", "gitignore", "gitattributes", "npmignore", "txt", "lock", "pipfile"]
# The TXT / LOCK / PIPFILE entries claim broad extensions and rely on
# filename_to_language() to specialize the few names we actually want
# (CMakeLists.txt / CMakeCache.txt / uv.lock / Pipfile.lock / bun.lock /
# poetry.lock). Files we don't recognize fall through to plain-text
# rendering inside our viewer.
detect_string = 'EXT="C" | EXT="H" | EXT="CPP" | EXT="CC" | EXT="CXX" | EXT="HPP" | EXT="HXX" | EXT="PY" | EXT="PYI" | EXT="JS" | EXT="MJS" | EXT="CJS" | EXT="JSX" | EXT="TS" | EXT="TSX" | EXT="MTS" | EXT="RS" | EXT="GO" | EXT="JAVA" | EXT="CS" | EXT="PHP" | EXT="LUA" | EXT="SH" | EXT="BASH" | EXT="ZSH" | EXT="BASHRC" | EXT="BASH_PROFILE" | EXT="BASH_ALIASES" | EXT="BASH_LOGOUT" | EXT="ZSHRC" | EXT="ZSHENV" | EXT="ZPROFILE" | EXT="ZLOGIN" | EXT="ZLOGOUT" | EXT="PROFILE" | EXT="ENVRC" | EXT="PS1" | EXT="PSM1" | EXT="PSD1" | EXT="VIM" | EXT="VIMRC" | EXT="NVIMRC" | EXT="JSON" | EXT="JSONC" | EXT="TOML" | EXT="YAML" | EXT="YML" | EXT="HTML" | EXT="HTM" | EXT="XML" | EXT="SVG" | EXT="CSS" | EXT="MD" | EXT="MARKDOWN" | EXT="VCXPROJ" | EXT="CSPROJ" | EXT="FSPROJ" | EXT="VBPROJ" | EXT="PROJ" | EXT="PROPS" | EXT="TARGETS" | EXT="FILTERS" | EXT="SLNX" | EXT="XAML" | EXT="RESX" | EXT="CMAKE" | EXT="SQL" | EXT="DOCKERFILE" | EXT="DOCKERIGNORE" | EXT="GITCONFIG" | EXT="GITMODULES" | EXT="GITIGNORE" | EXT="GITATTRIBUTES" | EXT="NPMIGNORE" | EXT="TXT" | EXT="LOCK" | EXT="PIPFILE"'

[display]
line_numbers = true
word_wrap = false
tab_width = 4
# "none", "all", or "boundary" (leading/trailing only)
show_whitespace = "boundary"
show_indent_guides = true
highlight_trailing = true

[fonts]
code = "Cascadia Code"
code_size = 13.0

[spacing]
line_height_factor = 1.4

[colors.light]
background = "#FFFFFF"
text = "#1F2328"
heading = "#1F2328"
muted = "#57606A"
link = "#0969DA"
link_hover = "#0550AE"
code_bg = "#E8ECF0"
quote_border = "#D0D7DE"
rule = "#D8DEE4"
selection = "#DDEBFF"
search_highlight = "#FFE066"
search_highlight_current = "#FFA500"

[colors.dark]
background = "#1E1E1E"
text = "#D4D4D4"
heading = "#E0E0E0"
muted = "#808080"
link = "#58A6FF"
link_hover = "#79C0FF"
code_bg = "#2D2D2D"
quote_border = "#404040"
rule = "#404040"
selection = "#264F78"
search_highlight = "#A87800"
search_highlight_current = "#E89820"
