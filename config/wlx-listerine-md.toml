version = 2

[general]
extensions = ["md", "markdown", "mdown", "mkd", "mkdn"]
detect_string = 'EXT="MD" | EXT="MARKDOWN"'

[fonts]
body = "Segoe UI"
body_size = 14.0
code = "Cascadia Code"
code_size = 13.0
emoji = "Segoe UI Emoji"

[spacing]
paragraph = 12.0
heading_above = 24.0
heading_below = 12.0
list_indent = 24.0
quote_indent = 16.0
quote_border_width = 3.0
code_padding = 8.0
line_height_factor = 1.5

[colors.light]
background = "#FFFFFF"
text = "#1F2328"
heading = "#1F2328"
muted = "#57606A"
link = "#0969DA"
link_hover = "#0550AE"
code_bg = "#E8ECF0"
quote_border = "#D0D7DE"
rule = "#D8DEE4"
selection = "#DDEBFF"

[colors.dark]
background = "#1E1E1E"
text = "#D4D4D4"
heading = "#E0E0E0"
muted = "#808080"
link = "#58A6FF"
link_hover = "#79C0FF"
code_bg = "#2D2D2D"
quote_border = "#404040"
rule = "#404040"
selection = "#264F78"

[code]
grammar_dir = "grammars"
theme_dir = "themes"
default_language = ""
theme = "default"
